[project]
name = "workbench-cs2-engine"
version = "0.1.0"
description = "WorkBench CS2 demo 解析与高光预览引擎"
requires-python = ">=3.12,<3.13"
dependencies = ["demoparser2==0.42.2"]

[dependency-groups]
build = ["pyinstaller>=6,<7"]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
cs2-engine = "cs2_engine.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cs2_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
