[project]
name = "workbench-finance-engine"
version = "0.1.0"
description = "WorkBench 金融指标取数与计算引擎"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28,<1", "pandas>=2.2,<3", "numpy>=2,<3"]

[dependency-groups]
build = [
    "pyinstaller>=6,<7",
]
dev = ["pytest>=8,<10", "respx>=0.22,<1", "ruff>=0.14,<1"]

[project.scripts]
finance-engine = "finance_engine.__main__:main"

[project.optional-dependencies]
akshare = [
    "akshare==1.20.35",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: 需要本机 TUSHARE_TOKEN 的联网测试，CI 默认排除"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
