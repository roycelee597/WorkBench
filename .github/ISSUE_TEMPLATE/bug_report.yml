name: 问题报告
description: 报告 WorkBench 的错误或异常行为
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 出现了什么问题？
      description: 请描述实际行为和你期望的行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WorkBench 版本或提交号
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows 版本与运行方式
      placeholder: Windows 11，开发模式或安装包
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 如有报错，请提供完整报错内容。
