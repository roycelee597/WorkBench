name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finance-python:
    name: 金融引擎 Python
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: engines/finance
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: engines/finance/uv.lock
      - name: 安装锁定的 Python 依赖
        run: uv sync --locked --python 3.12
      - name: 检查 Python 代码
        run: uv run --locked ruff check .
      - name: 检查 Python 格式
        run: uv run --locked ruff format --check .
      - name: 运行不联网的 Python 单元测试
        run: uv run --locked pytest

  windows:
    name: Windows CI
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装项目指定的 pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: false

      - name: 安装 Node.js 24 LTS 并缓存 pnpm
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 检查代码规范
        run: pnpm lint

      - name: 检查代码与文档格式
        run: pnpm exec prettier . --check

      - name: 检查类型
        run: pnpm typecheck

      - name: 运行单元测试
        run: pnpm test

      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: engines/finance/uv.lock

      - name: 打包并运行金融 sidecar 冒烟测试
        run: pnpm finance:engine

      - name: 编译 Windows 桌面应用
        run: pnpm --filter desktop tauri build --no-bundle
